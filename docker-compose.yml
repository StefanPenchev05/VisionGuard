services:
  ai-models:
    build:
      context: ./services/ai-models
      dockerfile: Dockerfile
    container_name: visionguard-ai-models
    environment:
      PYTHONPATH: /app/src
      VISIONGUARD_AI_MODEL_DIR: /data/models
    ports:
      - "8765:8765"
    volumes:
      - ./.visionguard/models:/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
