[project]
name = "visionguard-ai-models"
version = "0.1.0"
description = "VisionGuard AI model service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "mediapipe>=0.10.21,<1.1",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10.0,<5",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0"
]

[project.scripts]
visionguard-ai-api = "interfaces.api.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
